name: Bug report
description: Report a problem with window display, quota, settings or installation
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please read README.md and CHANGELOG.md first, and state your version and whether you modified anything.
        Do not include API keys, auth files, full chat logs or unredacted account screenshots.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, Codex version, Node.js version, number of displays and scaling, and whether this is a fresh install or an upgrade.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The order of actions (switching apps, minimizing, Mission Control, saving or cancelling settings) and how often it happens.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional details (redacted)
      description: Error type, approximate time, and cropped screenshots. Real account data or endpoint URLs are not needed.
