name: Feature request
description: Suggest an improvement to Codex Blue Whale
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before suggesting, please check the [README](https://github.com/junyii37/codex-blue-whale/blob/main/README.md)
        and [changelog](https://github.com/junyii37/codex-blue-whale/blob/main/CHANGELOG.md).
        Describe your use case and the behavior you expect.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI and interaction (menu, bubbles, dragging, flipping)
        - Quota and usage display
        - Install and runtime stability (auto-start, following, recovery)
        - Assets and sound (characters, bubble GIFs, sound sets)
        - Performance and resource usage
        - Documentation and maintainability
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describing the current situation and pain point helps more than proposing a solution directly.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposed approach (optional)
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried (optional)
    validations:
      required: false
  - type: dropdown
    id: upstream
    attributes:
      label: Does this also apply to the upstream DSH web widget?
      options:
        - Only to this Codex desktop build
        - Both (may belong upstream)
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: My report contains no real keys or credentials
          required: true
        - label: I searched existing issues and docs and found no duplicate
          required: true
